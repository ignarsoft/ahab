name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install download tools
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
      - uses: actions/checkout@v4
      - name: Install without system Python
        run: |
          bash install.sh --dev --no-systemd
          /opt/ahab/.venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          /opt/ahab/.venv/bin/python -m pytest -q
          /opt/ahab/.venv/bin/ahab --help

  systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test real systemd installation and sandbox
        shell: bash
        run: sudo bash tests/integration/systemd.sh "$(command -v python)"
      - name: Service diagnostics
        if: failure()
        run: sudo journalctl -u ahab --no-pager -n 100

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: sudo bash install.sh --dev --no-systemd --python "$(command -v python)"
      - name: Test and lint
        shell: bash
        run: |
          PYTHON=/opt/ahab/.venv/bin/python
          "$PYTHON" -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          "$PYTHON" -m pytest -q
          "$PYTHON" -m ruff check ahab tests
          "$PYTHON" -m ruff format --check ahab tests
          "$PYTHON" -m ahab.cli --help
          bash -n install.sh
