name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install download tools
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
      - uses: actions/checkout@v4
      - name: Install without system Python
        run: |
          bash install.sh --dev
          /opt/ahab/.venv/bin/python -m pytest -q
          /opt/ahab/.venv/bin/ahab --help

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.13']
        include:
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: sudo bash install.sh --dev
      - name: Test and lint
        shell: bash
        run: |
          PYTHON=/opt/ahab/.venv/bin/python
          "$PYTHON" -m pytest -q
          "$PYTHON" -m ruff check ahab tests
          "$PYTHON" -m ruff format --check ahab tests
          "$PYTHON" -m ahab.cli --help
          bash -n install.sh
