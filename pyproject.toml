[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ahab"
version = "0.1.0"
description = "Conservative, restart-safe Oracle A1 capacity hunter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["oci>=2.150,<3", "portalocker>=3,<4", "cryptography>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.urls]
Repository = "https://github.com/ignarsoft/ahab"
Issues = "https://github.com/ignarsoft/ahab/issues"

[project.scripts]
ahab = "ahab.cli:main"

[tool.setuptools.packages.find]
include = ["ahab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["references", ".venv"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
